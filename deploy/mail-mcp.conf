# Canonical endpoint: https://mcp.example.com/mail
# Follow the existing gateway's OAuth / static-bearer routing.
# MAIL_BACKEND_AUTH is defined in the root-readable mail-mcp-token.conf.
location ~ ^/mail(?:/mcp)?/?$ {
    client_max_body_size 12m;
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization, Accept, Mcp-Session-Id, Mcp-Protocol-Version, Last-Event-ID" always;
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS" always;
        add_header Access-Control-Max-Age 3600 always;
        return 204;
    }
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Expose-Headers "Mcp-Session-Id, WWW-Authenticate" always;
    set $mail_upstream http://127.0.0.1:8080;
    set $mail_path /mail/mcp;
    set $mail_authorization $http_authorization;
    if ($is_bearer_auth = 1) {
        set $mail_upstream http://127.0.0.1:3110;
        set $mail_path /mcp;
        set $mail_authorization $mail_backend_auth;
    }
    proxy_pass $mail_upstream$mail_path$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization $mail_authorization;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    proxy_read_timeout 180;
    proxy_send_timeout 180;
}

location = /.well-known/oauth-protected-resource/mail {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    return 200 '{"resource":"https://mcp.example.com/mail","authorization_servers":["https://mcp.example.com"],"bearer_methods_supported":["header"]}\n';
}

location = /.well-known/oauth-protected-resource/mail/mcp {
    default_type application/json;
    add_header Access-Control-Allow-Origin "*" always;
    return 200 '{"resource":"https://mcp.example.com/mail/mcp","authorization_servers":["https://mcp.example.com"],"bearer_methods_supported":["header"]}\n';
}
