[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sexy-email-mcp"
version = "1.0.0"
description = "Two-account Runbox MCP behind mcp-front"
requires-python = ">=3.12"
dependencies = ["mcp==2.3.0", "email-validator>=2.3.0,<3"]

[project.scripts]
sexy-email-mcp = "mail_gateway:main"

[tool.setuptools]
py-modules = ["mail_gateway"]
