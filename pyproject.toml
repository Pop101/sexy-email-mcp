[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "runbox-mail-mcp"
version = "1.0.0"
description = "Two-account Runbox MCP behind mcp-front"
requires-python = ">=3.12"
dependencies = ["mcp==1.26.0"]

[project.scripts]
runbox-mail-mcp = "mail_gateway:main"

[tool.setuptools]
py-modules = ["mail_gateway"]
